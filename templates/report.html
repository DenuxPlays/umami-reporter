<!doctype html>
<html lang="de">
<body style="margin:0; padding:0; color:#243447; font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                   style="max-width:620px; background-color:#ffffff; border:1px solid #dfe7ef; border-radius:12px;">
                <tr>
                    <td style="padding:32px 36px 24px; background-color:#176b87; border-radius:12px 12px 0 0;">
                        <p style="margin:0 0 8px; color:#b9e3ee; font-size:13px; font-weight:bold; letter-spacing:1px; text-transform:uppercase;">
                            Website Analytics</p>
                        <h1 style="margin:0; color:#ffffff; font-size:26px; line-height:1.3; font-weight:700;">
                            Monatsbericht</h1>
                        <p style="margin:8px 0 0; color:#e0f3f7; font-size:16px;">Übersicht für {{ month }}</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px 36px 12px;">
                        <p style="margin:0; color:#526575; font-size:15px; line-height:1.6;">Hier ist die
                            Zusammenfassung der wichtigsten Website-Kennzahlen:</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:12px 24px 28px;">
                        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td width="33%" style="padding:0 6px;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                           style="background-color:#eef8fb; border-radius:8px;">
                                        <tr>
                                            <td align="center" style="padding:20px 8px;">
                                                <p style="margin:0 0 8px; color:#176b87; font-size:12px; font-weight:bold; text-transform:uppercase;">
                                                    Besucher</p>
                                                <p style="margin:0; color:#243447; font-size:26px; font-weight:bold;">{{
                                                    visitors }}</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                                <td width="33%" style="padding:0 6px;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                           style="background-color:#f3f0fb; border-radius:8px;">
                                        <tr>
                                            <td align="center" style="padding:20px 8px;">
                                                <p style="margin:0 0 8px; color:#6953a8; font-size:12px; font-weight:bold; text-transform:uppercase;">
                                                    Besuche</p>
                                                <p style="margin:0; color:#243447; font-size:26px; font-weight:bold;">{{
                                                    visits }}</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                                <td width="33%" style="padding:0 6px;">
                                    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
                                           style="background-color:#fdf5e8; border-radius:8px;">
                                        <tr>
                                            <td align="center" style="padding:20px 8px;">
                                                <p style="margin:0 0 8px; color:#b27622; font-size:12px; font-weight:bold; text-transform:uppercase;">
                                                    Seitenaufrufe</p>
                                                <p style="margin:0; color:#243447; font-size:26px; font-weight:bold;">{{
                                                    views }}</p>
                                            </td>
                                        </tr>
                                    </table>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 36px 28px; border-top:1px solid #edf1f4;">
                        <p style="margin:0; color:#526575; font-size:14px; line-height:1.6;">Viele Grüße<br><strong
                            style="color:#243447;">Ihr Website-Reporter</strong></p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
